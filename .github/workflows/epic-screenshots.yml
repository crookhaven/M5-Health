name: Epic listing screenshots (temporary)

on:
  push:
    branches: [epic-screenshots]
    paths-ignore: ['screenshots/**']

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the app
        working-directory: web
        run: npm ci && npm run build
      - name: Serve it
        working-directory: web
        run: (npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &) && sleep 5 && curl -sf http://localhost:4173/ > /dev/null
      - name: Take screenshots
        run: |
          mkdir -p /tmp/pw screenshots
          cd /tmp/pw && npm init -y > /dev/null && npm i playwright@1.48.2 > /dev/null && npx playwright install --with-deps chromium > /dev/null
          cp "$GITHUB_WORKSPACE/tools/screenshots/shots.mjs" /tmp/pw/shots.mjs
          OUT="$GITHUB_WORKSPACE/screenshots" node /tmp/pw/shots.mjs
      - name: Save them to this branch
        run: |
          git config user.name "screenshot-bot"
          git config user.email "screenshot-bot@users.noreply.github.com"
          git add screenshots
          git commit -qm "Screenshots"
          git push
