//
// A test tool for the "Kill the Clipboard" SMART Health Check-in connectathon
// (https://smart-health-checkin.org/connectathon/), covering BOTH roles of
// the postMessage-based web-wallet protocol, as two tabs on the home screen:
//   - Wallet tab (default): this page as the WALLET, answering a request --
//     serveWebWallet() below, driven by a real incoming request or the
//     "Preview" button.
//   - Verifier tab: this page as the VERIFIER/clinic/EHR side, building a
//     request and sending it to a wallet (this page's own URL included --
//     a quick way to run the full round trip in two tabs with nothing else
//     involved) via the official <smart-checkin-picker> element.
// Both sides use the official, unmodified client library -- this page does
// none of the mdoc/CBOR/COSE/HPKE work itself.
//
// Served as a plain static file (web/public/test-wallet/), so it carries no
// Content-Security-Policy restrictions and can load the library straight
// from its own host.
//
// Scenario coverage (see https://smart-health-checkin.org/connectathon/ and
// .../advanced.html):
//   Minimum scenarios -- demographics / problems / medications: supported.
//   any-us-core, decline-all, no-selector, unknown-selector: supported
//     (generic profile-based matching + the library's own fallbacks).
//   large-response, narrowed-family: supported -- see the synthetic
//     vitals/labs generator below, which exists specifically to give the
//     "everything in US Core" and "Observation-only" requests enough volume
//     and the right profile tags to exercise both scenarios.
//   form-by-reference, versioned-canonical: supported (resolveFormState
//     below fetches a bare questionnaireCanonical; the canonical is echoed
//     back verbatim including any |version suffix).
//   physician-form (enableWhen + repeats/open-choice): supported -- see
//     isItemEnabled/conditionMet and the choice/open-choice branch of
//     renderQuestionnaireItem. This logic runs against whatever Questionnaire
//     a real Verifier sends inline, so it isn't tied to the local PHYSICIAN_QUESTIONNAIRE
//     reconstruction below (kept only for the no-Verifier "Preview" button --
//     see the note where it's defined).
//   shared-artifact: supported -- see the "combine shareable records" toggle
//     on the consent screen and the pendingSelections merge in buildResponse.
//     Defaults OFF so it never changes the response shape for the minimum
//     scenarios; turn it on to test this one specifically.
//   health-card, insurance-card: NOT implemented. Both need a real SMART
//     Health Card signature (ES256 JWS + DEFLATE); the client library has
//     no wallet-side signer, only a fake-signature test fixture.
//   cross-device, in-person-handoff: not applicable to a web wallet (native
//     Android wallet + phone Credential Manager only).
//   write-back: not applicable to the wallet role (Verifier/EHR-side only).
//   prefilled-form: ambiguous for this form -- the semaglutide questionnaire
//     has no LOINC codes to key a prefill off of. Not implemented.

// Verifier (clinic/EHR) side -- used only by the "Verifier" tab below, which

// The connectathon's real wallet registry, used by the Verifier tab so it

// reference wallet, other teams' wallets) in addition to a one-off URL.
const REGISTRY_URL = "https://smart-health-checkin.org/connectathon/wallets.json";
const CUSTOM_WALLETS_KEY = "m5-verifier-custom-wallets";
function loadCustomWallets() {
  try {
    return JSON.parse(localStorage.getItem(CUSTOM_WALLETS_KEY) || "[]");
  } catch {
    return [];
  }
}
function saveCustomWallets(list) {
  try {
    localStorage.setItem(CUSTOM_WALLETS_KEY, JSON.stringify(list));
  } catch {
    // localStorage unavailable (private window, etc.) -- custom wallets just
    // won't persist across reloads; nothing else depends on this.
  }
}

// ---------------------------------------------------------------------------
// Bulk synthetic vitals/labs history -- generated, not hand-written.
//
// Exists specifically for two advanced scenarios:
//   - narrowed-family: a request that asks for Observations only (profilesFrom
//     US Core + resourceTypes: ["Observation"], see the real
//     connectathon/requests/observations.json). Needs *some* profiled
//     Observation data to match against at all -- the base record above had
//     none.
//   - large-response / any-us-core at scale: the same "everything in US Core"
//     request (connectathon/requests/uscdi.json) used for both any-us-core
//     and large-response. To actually exercise the "large" case the response
//     needs to clear roughly 1MB; a handful of hand-written resources never
//     will, so this generates several years of daily vitals plus weekly labs
//     instead. Target is comfortably over 1MB with margin, not exactly 1MB.
// ---------------------------------------------------------------------------

function daysAgoISO(n) {
  const d = new Date();
  d.setUTCDate(d.getUTCDate() - n);
  return d.toISOString().slice(0, 10);
}

function generateVitalsHistory(years) {
  const days = years * 365;
  const entries = [];
  for (let i = 0; i < days; i++) {
    const date = daysAgoISO(i);
    const systolic = 118 + Math.round(6 * Math.sin(i / 17)) + (i % 5);
    const diastolic = 76 + Math.round(4 * Math.sin(i / 23));
    const hr = 68 + (i % 11);
    entries.push({
      fullUrl: `urn:uuid:m5-vitals-${i}`,
      resource: {
        resourceType: "Observation",
        id: `m5-vitals-${i}`,
        meta: { profile: [US_CORE + "us-core-vital-signs", US_CORE + "us-core-blood-pressure"] },
        status: "final",
        category: [{ coding: [{ system: "http://terminology.hl7.org/CodeSystem/observation-category", code: "vital-signs" }] }],
        code: { coding: [{ system: "http://loinc.org", code: "85354-9", display: "Blood pressure panel with all children optional" }] },
        subject: { reference: PATIENT_URL },
        effectiveDateTime: date,
        component: [
          { code: { coding: [{ system: "http://loinc.org", code: "8480-6", display: "Systolic blood pressure" }] }, valueQuantity: { value: systolic, unit: "mmHg", system: "http://unitsofmeasure.org", code: "mm[Hg]" } },
          { code: { coding: [{ system: "http://loinc.org", code: "8462-4", display: "Diastolic blood pressure" }] }, valueQuantity: { value: diastolic, unit: "mmHg", system: "http://unitsofmeasure.org", code: "mm[Hg]" } },
          { code: { coding: [{ system: "http://loinc.org", code: "8867-4", display: "Heart rate" }] }, valueQuantity: { value: hr, unit: "/min", system: "http://unitsofmeasure.org", code: "/min" } },
        ],
      },
    });
    entries.push({
      fullUrl: `urn:uuid:m5-weight-${i}`,
      resource: {
        resourceType: "Observation",
        id: `m5-weight-${i}`,
        meta: { profile: [US_CORE + "us-core-vital-signs"] },
        status: "final",
        category: [{ coding: [{ system: "http://terminology.hl7.org/CodeSystem/observation-category", code: "vital-signs" }] }],
        code: { coding: [{ system: "http://loinc.org", code: "29463-7", display: "Body weight" }] },
        subject: { reference: PATIENT_URL },
        effectiveDateTime: date,
        valueQuantity: { value: 172 + Math.round(3 * Math.sin(i / 40)), unit: "lbs", system: "http://unitsofmeasure.org", code: "[lb_av]" },
      },
    });
  }
  return entries;
}

function generateLabHistory(years) {
  const weeks = years * 52;
  const entries = [];
  for (let i = 0; i < weeks; i++) {
    const date = daysAgoISO(i * 7);
    const a1c = Math.round((6.8 + 0.4 * Math.sin(i / 10)) * 10) / 10;
    entries.push({
      fullUrl: `urn:uuid:m5-lab-${i}`,
      resource: {
        resourceType: "Observation",
        id: `m5-lab-${i}`,
        meta: { profile: [US_CORE + "us-core-observation-lab"] },
        status: "final",
        category: [{ coding: [{ system: "http://terminology.hl7.org/CodeSystem/observation-category", code: "laboratory" }] }],
        code: { coding: [{ system: "http://loinc.org", code: "4548-4", display: "Hemoglobin A1c/Hemoglobin.total in Blood" }] },
        subject: { reference: PATIENT_URL },
        effectiveDateTime: date,
        valueQuantity: { value: a1c, unit: "%", system: "http://unitsofmeasure.org", code: "%" },
      },
    });
  }
  return entries;
}

const BULK_HISTORY_ENTRIES = [...generateVitalsHistory(5), ...generateLabHistory(10)];
const ALL_ENTRIES = [...RECORD_ENTRIES, ...BULK_HISTORY_ENTRIES];
const PATIENT_RESOURCE = RECORD_ENTRIES.find((e) => e.fullUrl === PATIENT_URL).resource;

// ---------------------------------------------------------------------------
// Matching + artifact building
// ---------------------------------------------------------------------------

// `selectEntries`'s `exclude` keeps the Patient out of every OTHER item's
// bundle, pulled in only by reference, so it isn't duplicated across every
// artifact. But a Demographics-style item that selects the Patient directly
// must not exclude the very thing it's asking for.
function excludeFor(item) {
  if (item.content?.kind === "selection.fhir" && selects(item.content, PATIENT_RESOURCE)) return [];
  return [PATIENT_URL];
}

function buildSelectionArtifact(item, entries) {
  return {
    id: `artifact-${item.id}`,
    mediaType: FHIR_MEDIA_TYPE,
    fhirVersion: FHIR_VERSION,
    fulfills: [item.id],
    value: {
      resourceType: "Bundle",
      type: "collection",
      entry: entries.map((e) => ({ fullUrl: e.fullUrl, resource: e.resource })),
    },
  };
}

// Approximate serialized size of a set of matched entries, for display only
// (not used in any matching decision). Good enough to show "this is the big
// one" without pretending to be the exact byte count the wire format sends.
function formatBytes(n) {
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
  return `${(n / (1024 * 1024)).toFixed(2)} MB`;
}
function entriesSize(entries) {
  return JSON.stringify(entries.map((e) => e.resource)).length;
}

// ---------------------------------------------------------------------------
// Questionnaire support: group, display, boolean, string, text, integer,
// decimal, date, choice, open-choice, with enableWhen (any/all behavior,
// operators exists/=/!=) and repeats (multi-select + free text for
// open-choice). Generic -- this isn't tied to the PHQ-2 or semaglutide forms,
// it answers whatever Questionnaire a request actually supplies.
// ---------------------------------------------------------------------------

function flattenQuestionnaireItems(items, out = []) {
  for (const item of items ?? []) {
    out.push(item);
    if (item.item?.length) flattenQuestionnaireItems(item.item, out);
  }
  return out;
}

function codingKey(coding) {
  return coding ? `${coding.system ?? ""}|${coding.code ?? ""}` : "";
}

function conditionMet(cond, values) {
  const raw = values[cond.question];
  const hasValue = Array.isArray(raw)
    ? raw.length > 0
    : raw !== undefined && raw !== "" && raw !== null && raw !== false;
  if (cond.operator === "exists") {
    const want = cond.answerBoolean !== false; // default: enabled when the answer exists
    return hasValue === want;
  }
  const target = cond.answerCoding ? codingKey(cond.answerCoding)
    : cond.answerBoolean !== undefined ? cond.answerBoolean
    : cond.answerString !== undefined ? cond.answerString
    : cond.answerInteger !== undefined ? cond.answerInteger
    : cond.answerDecimal;
  const actual = Array.isArray(raw) ? raw : [raw];
  const matches = actual.some((v) => v === target);
  return cond.operator === "!=" ? !matches : matches; // "=" and anything unrecognized fall back to equality
}

function isItemEnabled(qItem, values) {
  if (!qItem.enableWhen?.length) return true;
  const results = qItem.enableWhen.map((c) => conditionMet(c, values));
  return qItem.enableBehavior === "all" ? results.every(Boolean) : results.some(Boolean);
}

function qrItemFor(qItem, values) {
  if (!isItemEnabled(qItem, values)) return null;
  const children = (qItem.item ?? []).map((child) => qrItemFor(child, values)).filter(Boolean);
  let answer;
  if (qItem.type === "choice" || qItem.type === "open-choice") {
    const raw = values[qItem.linkId];
    const keys = qItem.repeats ? (Array.isArray(raw) ? raw : []) : raw ? [raw] : [];
    const built = keys.map((key) => {
      const opt = (qItem.answerOption ?? []).find((o) => codingKey(o.valueCoding) === key);
      return opt ? { valueCoding: opt.valueCoding } : { valueString: key };
    });
    const other = values[`${qItem.linkId}__other`];
    if (other) built.push({ valueString: other });
    if (built.length) answer = built;
  } else {
    const raw = values[qItem.linkId];
    if (raw !== undefined && raw !== "" && raw !== null && raw !== false) {
      switch (qItem.type) {
        case "boolean":
          answer = [{ valueBoolean: true }];
          break;
        case "integer":
          answer = [{ valueInteger: Number(raw) }];
          break;
        case "decimal":
          answer = [{ valueDecimal: Number(raw) }];
          break;
        case "date":
          answer = [{ valueDate: raw }];
          break;
        default:
          answer = [{ valueString: String(raw) }];
      }
    }
  }
  if (!answer && children.length === 0) return null; // omit unanswered/disabled leaf items
  return {
    linkId: qItem.linkId,
    text: qItem.text,
    ...(answer ? { answer } : {}),
    ...(children.length ? { item: children } : {}),
  };
}

function buildQuestionnaireResponse(item, questionnaire, values) {
  const canonical = item.content.questionnaireCanonical ?? questionnaire?.url;
  const qrItems = (questionnaire.item ?? []).map((qi) => qrItemFor(qi, values)).filter(Boolean);
  return {
    resourceType: "QuestionnaireResponse",
    status: "completed",
    questionnaire: canonical,
    subject: { reference: PATIENT_URL },
    authored: new Date().toISOString(),
    item: qrItems,
  };
}

// ---------------------------------------------------------------------------
// Request/response assembly
// ---------------------------------------------------------------------------

// `unsupportedItems` entries aren't fully documented; this reads whichever
// shape shows up (a bare id string, or an object carrying `item`/`id`/`itemId`).
function unsupportedIdOf(entry) {
  if (typeof entry === "string") return entry;
  return entry?.item ?? entry?.id ?? entry?.itemId;
}

// `options.combineShared`: when true, every selection.fhir item that matched
// at least one record is pooled and answered with ONE shared Bundle artifact
// (fulfills listing every item it satisfies, entries de-duplicated by
// fullUrl) instead of one artifact per item. Defaults to false so the
// minimum-scenario response shape never changes unless this is deliberately
// turned on -- see the "shared-artifact" scenario.
function buildResponse(request, unsupportedItems, decisions, formState, options = {}) {
  const combineShared = !!options.combineShared;
  const unsupportedIds = new Set((unsupportedItems ?? []).map(unsupportedIdOf).filter(Boolean));
  const requestStatus = [];
  const artifacts = [];
  const pendingSelections = [];

  for (const item of request.items) {
    if (unsupportedIds.has(item.id)) {
      requestStatus.push({ item: item.id, status: "unsupported" });
      continue;
    }

    const decision = decisions[item.id];
    if (!decision || decision.share === false) {
      requestStatus.push({ item: item.id, status: "declined" });
      continue;
    }

    const accept = item.accept ?? [];
    if (!accept.includes(FHIR_MEDIA_TYPE)) {
      requestStatus.push({ item: item.id, status: "unsupported", message: "This wallet only produces application/fhir+json for this item." });
      continue;
    }

    if (item.content?.kind === "selection.fhir") {
      const entries = selectEntries(item.content, ALL_ENTRIES, { exclude: excludeFor(item) });
      if (entries.length === 0) {
        requestStatus.push({ item: item.id, status: "unavailable" });
      } else if (combineShared) {
        pendingSelections.push({ item, entries });
      } else {
        artifacts.push(buildSelectionArtifact(item, entries));
        requestStatus.push({ item: item.id, status: "fulfilled" });
      }
      continue;
    }

    if (item.content?.kind === "form.fhir") {
      const form = formState[item.id];
      if (!form?.questionnaire) {
        requestStatus.push({ item: item.id, status: "unsupported", message: "Could not resolve this form." });
        continue;
      }
      const qr = buildQuestionnaireResponse(item, form.questionnaire, decision.answers ?? {});
      if (!qr.item.length) {
        requestStatus.push({ item: item.id, status: "unavailable" });
        continue;
      }
      artifacts.push({
        id: `artifact-${item.id}`,
        mediaType: FHIR_MEDIA_TYPE,
        fhirVersion: FHIR_VERSION,
        fulfills: [item.id],
        value: qr,
      });
      requestStatus.push({ item: item.id, status: "fulfilled" });
      continue;
    }

    // Unknown content kind the library didn't already flag.
    requestStatus.push({ item: item.id, status: "unsupported" });
  }

  if (pendingSelections.length === 1) {
    const { item, entries } = pendingSelections[0];
    artifacts.push(buildSelectionArtifact(item, entries));
    requestStatus.push({ item: item.id, status: "fulfilled" });
  } else if (pendingSelections.length > 1) {
    const merged = new Map();
    for (const { entries } of pendingSelections) {
      for (const e of entries) merged.set(e.fullUrl, e);
    }
    artifacts.push({
      id: `artifact-shared-${pendingSelections.map((p) => p.item.id).join("-")}`,
      mediaType: FHIR_MEDIA_TYPE,
      fhirVersion: FHIR_VERSION,
      fulfills: pendingSelections.map((p) => p.item.id),
      value: {
        resourceType: "Bundle",
        type: "collection",
        entry: [...merged.values()].map((e) => ({ fullUrl: e.fullUrl, resource: e.resource })),
      },
    });
    for (const { item } of pendingSelections) requestStatus.push({ item: item.id, status: "fulfilled" });
  }

  return {
    type: "smart-health-checkin-response",
    version: "1",
    requestId: request.id,
    artifacts,
    requestStatus,
  };
}

// ---------------------------------------------------------------------------
// UI
// ---------------------------------------------------------------------------

const app = document.getElementById("app");

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "html") node.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null) node.setAttribute(k, v);
  }
  for (const child of [].concat(children)) {
    if (child == null) continue;
    node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
  }
  return node;
}

function statusPill(text, kind) {
  return el("span", { class: `pill${kind ? ` ${kind}` : ""}` }, text);
}

// Tracks every rendered Questionnaire item by linkId so enableWhen can
// re-evaluate visibility on every change, anywhere in the form.
function makeVisibilityRefresh(registry, values) {
  return function refresh() {
    for (const { wrapper, qItem } of registry.values()) {
      if (qItem.enableWhen?.length) wrapper.hidden = !isItemEnabled(qItem, values);
    }
  };
}

// Renders one Questionnaire item (recursively for groups) into `container`,
// wiring plain form controls that write into `values` by linkId. `ctx`
// (optional) carries { registry, refresh } for enableWhen support.
function renderQuestionnaireItem(qItem, values, container, ctx) {
  if (qItem.type === "display") {
    const node = el("p", { class: "q-text" }, qItem.text);
    container.appendChild(node);
    ctx?.registry.set(qItem.linkId, { wrapper: node, qItem });
    return;
  }
  const wrap = el("div", { class: "q-item" });
  if (qItem.text) wrap.appendChild(el("div", { class: "q-text" }, qItem.text));
  const notify = () => ctx?.refresh();

  if (qItem.type === "group") {
    for (const child of qItem.item ?? []) renderQuestionnaireItem(child, values, wrap, ctx);
  } else if (qItem.type === "boolean") {
    const input = el("input", {
      type: "checkbox",
      id: `q-${qItem.linkId}`,
      onchange: (e) => {
        values[qItem.linkId] = e.target.checked;
        notify();
      },
    });
    wrap.appendChild(el("label", { for: `q-${qItem.linkId}` }, [input, " Yes"]));
  } else if (qItem.type === "choice" || qItem.type === "open-choice") {
    const isRepeating = !!qItem.repeats;
    if (isRepeating && !Array.isArray(values[qItem.linkId])) values[qItem.linkId] = [];
    const options = el("div", { class: "q-options" });
    for (const opt of qItem.answerOption ?? []) {
      const key = codingKey(opt.valueCoding);
      const id = `q-${qItem.linkId}-${key}`;
      const input = el("input", {
        type: isRepeating ? "checkbox" : "radio",
        ...(isRepeating ? {} : { name: `q-${qItem.linkId}` }),
        id,
        onchange: (e) => {
          if (isRepeating) {
            const arr = values[qItem.linkId];
            const idx = arr.indexOf(key);
            if (e.target.checked && idx === -1) arr.push(key);
            else if (!e.target.checked && idx !== -1) arr.splice(idx, 1);
          } else {
            values[qItem.linkId] = key;
          }
          notify();
        },
      });
      options.appendChild(el("label", { class: "q-option", for: id }, [input, opt.valueCoding?.display ?? opt.valueCoding?.code ?? "(option)"]));
    }
    if (qItem.type === "open-choice") {
      const otherId = `q-${qItem.linkId}-other`;
      const otherInput = el("input", {
        type: "text",
        id: otherId,
        placeholder: "Something else…",
        oninput: (e) => {
          values[`${qItem.linkId}__other`] = e.target.value;
          notify();
        },
      });
      options.appendChild(el("label", { class: "q-option", for: otherId }, [otherInput, " Something else"]));
    }
    wrap.appendChild(options);
  } else if (qItem.type === "integer" || qItem.type === "decimal") {
    wrap.appendChild(el("input", {
      type: "number",
      step: qItem.type === "decimal" ? "any" : "1",
      oninput: (e) => {
        values[qItem.linkId] = e.target.value;
        notify();
      },
    }));
  } else if (qItem.type === "date") {
    wrap.appendChild(el("input", {
      type: "date",
      oninput: (e) => {
        values[qItem.linkId] = e.target.value;
        notify();
      },
    }));
  } else {
    // string, text, and anything else we don't specifically handle
    wrap.appendChild(el("input", {
      type: "text",
      oninput: (e) => {
        values[qItem.linkId] = e.target.value;
        notify();
      },
    }));
  }
  container.appendChild(wrap);
  ctx?.registry.set(qItem.linkId, { wrapper: wrap, qItem });
}

function itemCard({ item, unsupported, decisions, formState, onToggle }) {
  const card = el("div", { class: "card" });
  const row = el("div", { class: "item-row" });
  const meta = el("div", { class: "item-meta" }, [
    el("div", { class: "item-title" }, item.title ?? item.id),
    item.summary ? el("div", { class: "item-summary" }, item.summary) : null,
    item.required ? statusPill("Clinic marked this needed -- your choice either way", "warn") : null,
  ]);
  row.appendChild(meta);

  if (unsupported) {
    row.appendChild(statusPill("Not supported by this wallet", "off"));
    card.appendChild(row);
    card.appendChild(el("p", { class: "muted" }, "This item's request format isn't one this test wallet can answer. It will be reported as unsupported."));
    return card;
  }

  const checked = decisions[item.id]?.share !== false;
  const toggle = el("button", {
    class: "toggle",
    role: "switch",
    "aria-checked": String(checked),
    type: "button",
    onclick: (e) => {
      decisions[item.id].share = !decisions[item.id].share;
      e.currentTarget.setAttribute("aria-checked", String(decisions[item.id].share));
    },
  });
  row.appendChild(toggle);
  card.appendChild(row);

  if (item.content?.kind === "form.fhir") {
    const form = formState[item.id];
    const block = el("div", { class: "form-block" });
    if (form?.questionnaire) {
      const values = (decisions[item.id].answers ??= {});
      const registry = new Map();
      const ctx = { registry, refresh: null };
      ctx.refresh = makeVisibilityRefresh(registry, values);
      for (const qItem of form.questionnaire.item ?? []) renderQuestionnaireItem(qItem, values, block, ctx);
      ctx.refresh();
    } else {
      block.appendChild(el("p", { class: "muted" }, "Could not load this form."));
    }
    card.appendChild(block);
  } else if (item.content?.kind === "selection.fhir") {
    const entries = selectEntries(item.content, ALL_ENTRIES, { exclude: excludeFor(item) });
    card.appendChild(
      el(
        "p",
        { class: "bundle-note" },
        entries.length
          ? `Matches ${entries.length} record${entries.length === 1 ? "" : "s"} in this test wallet (~${formatBytes(entriesSize(entries))}).`
          : "No matching record in this test wallet -- will be reported as unavailable.",
      ),
    );
  }

  return card;
}

function renderConsentScreen({ request, origin, unsupportedItems, formState, onSubmit, onDeclineAll }) {
  app.innerHTML = "";
  const decisions = {};
  for (const item of request.items) decisions[item.id] = { share: true, answers: {} };
  const combineState = { value: false };

  const unsupportedIds = new Set((unsupportedItems ?? []).map(unsupportedIdOf).filter(Boolean));

  app.appendChild(el("h1", {}, "Share your health information?"));
  app.appendChild(
    el("div", { class: "origin-banner" }, [
      "A website is asking for your health information: ",
      el("br"),
      el("strong", {}, origin),
    ]),
  );
  if (request.purpose) app.appendChild(el("p", { class: "muted" }, request.purpose));

  const combineRow = el("div", { class: "item-row" });
  combineRow.appendChild(
    el("div", { class: "item-meta" }, [
      el("div", { class: "item-title" }, "Combine shareable records into one bundle"),
      el("div", { class: "item-summary" }, "When more than one item below can be answered with FHIR records, reply with a single shared bundle instead of one per item. Off by default; tests the “shared-artifact” scenario."),
    ]),
  );
  const combineToggle = el("button", {
    class: "toggle",
    role: "switch",
    "aria-checked": "false",
    type: "button",
    onclick: (e) => {
      combineState.value = !combineState.value;
      e.currentTarget.setAttribute("aria-checked", String(combineState.value));
    },
  });
  combineRow.appendChild(combineToggle);
  app.appendChild(el("div", { class: "card" }, [combineRow]));

  const list = el("div", { class: "status-list" });
  for (const item of request.items) {
    list.appendChild(
      itemCard({
        item,
        unsupported: unsupportedIds.has(item.id),
        decisions,
        formState,
      }),
    );
  }
  app.appendChild(list);

  const actions = el("div", { class: "actions" });
  actions.appendChild(
    el("button", { onclick: () => onSubmit(decisions, combineState.value) }, "Decline all"),
  );
  const shareBtn = el("button", { class: "primary", onclick: () => onSubmit(decisions, combineState.value) }, "Share selected items");
  actions.appendChild(shareBtn);
  app.appendChild(actions);

  // "Decline all" above reuses onSubmit with every toggle off instead of a
  // separate declineAll button, except when the caller wants the exact
  // declineAll(request) shape (see wireRealRequest below) -- swap the handler:
  actions.firstChild.onclick = onDeclineAll;

  app.appendChild(el("p", { class: "footer-note" }, "M5 Health Test Wallet -- synthetic data only, built for the SMART Health Check-in connectathon."));
}

function renderDone({ origin, response }) {
  app.innerHTML = "";
  app.appendChild(el("h1", {}, "Sent"));
  app.appendChild(el("p", { class: "muted" }, `Replied to ${origin}.`));
  const list = el("div", { class: "status-list" });
  for (const s of response.requestStatus) {
    list.appendChild(
      el("div", { class: "status-row" }, [
        el("span", {}, s.item),
        statusPill(s.status, s.status === "fulfilled" ? "" : s.status === "declined" || s.status === "unsupported" ? "off" : "warn"),
      ]),
    );
  }
  app.appendChild(list);
  if (response.artifacts?.length) {
    app.appendChild(
      el(
        "p",
        { class: "bundle-note" },
        `${response.artifacts.length} artifact${response.artifacts.length === 1 ? "" : "s"} sent (~${formatBytes(JSON.stringify(response.artifacts).length)} total).`,
      ),
    );
  }
  app.appendChild(el("div", { class: "actions" }, [el("button", { onclick: () => window.close() }, "Close window")]));
}

// Two tabs on the home screen: "Wallet" (this page answering a request --
// the original, still-default behavior) and "Verifier" (this page SENDING
// one, to itself or another team's wallet). Only shown on the home screen;
// a real incoming protocol request still takes over the whole page via
// renderConsentScreen/renderDone, same as before this tab system existed.
let homeTab = "wallet";

function renderHome({ opened }) {
  app.innerHTML = "";
  app.appendChild(
    el("div", { class: "tabs" }, [
      el("button", {
        class: `tab-btn${homeTab === "wallet" ? " active" : ""}`,
        type: "button",
        onclick: () => {

          renderHome({ opened });

  else renderWalletTab({ opened });
}

function renderWalletTab({ opened }) {

  const copyRow = el("div", { class: "copy-row" });

  previewCard.appendChild(el("h2", {}, "Preview the consent screen"));
  previewCard.appendChild(el("p", { class: "muted" }, "Shows this wallet's own UI against a bundle of sample requests covering the minimum scenarios plus large-response, narrowed-family, physician-form (enableWhen + repeats), and shared-artifact (toggle), without a real Verifier or the signing/encryption step."));
  previewCard.appendChild(el("button", { onclick: showPreview }, "Preview"));

  if (!opened) {
    app.appendChild(el("p", { class: "muted" }, "Opened directly, not from a check-in page, so there's nothing to answer right now. Use the Verifier tab above to send yourself a request instead."));

  const coverageCard = el("div", { class: "card" });

    el("p", { class: "muted" }, "This reflects what this page's code handles. It has not been checked against every team's Verifier, so treat “Supported” as “built to handle”, not “certified”. Preview, or a Verifier-tab round trip to this same URL, are the quickest self-checks."),

// ---------------------------------------------------------------------------
// Verifier tab -- this page playing the CLINIC/EHR role: building a request
// and sending it to a wallet (this same page's own URL, or another team's),
// instead of answering one. Uses the official <smart-checkin-picker> element
// rather than hand-rolling the window.open()/postMessage timing ourselves --
// that timing is click-handler-sensitive (see docs/web-wallets.md) and the
// picker already gets it right.
// ---------------------------------------------------------------------------

function renderVerifierTab() {
  app.appendChild(el("h1", {}, "Verifier"));
  app.appendChild(
    el("p", {}, [
      "Play the clinic's role: build a request and send it to a wallet, then see what comes back. Add ",
      el("strong", {}, "this page's own URL"),
      " below to run the full Wallet ↔ Verifier round trip in two tabs with nothing else involved, or add another team's wallet URL to test against theirs.",
    ]),
  );

  const walletCard = el("div", { class: "card" });
  walletCard.appendChild(el("h2", {}, "Add a wallet by URL"));
  walletCard.appendChild(
    el("p", { class: "muted" }, "Kept in this browser only (localStorage) -- the same way the SMART Testing EHR's own “Web wallet URL” field works, so you can test before anything is registered."),
  );
  const nameInput = el("input", { type: "text", placeholder: "Name (e.g. M5 Health self-test)" });
  const urlInput = el("input", { type: "text", placeholder: "https://…/test-wallet/" });
  walletCard.appendChild(el("div", { class: "copy-row" }, [nameInput]));
  walletCard.appendChild(el("div", { class: "copy-row" }, [urlInput]));
  const addActions = el("div", { class: "actions" });
  addActions.appendChild(
    el("button", {
      type: "button",
      onclick: () => {
        urlInput.value = location.href;
        nameInput.value = "This page (self-test)";
      },
    }, "Use this page's URL"),
  );
  const addBtn = el("button", { class: "primary", type: "button", onclick: () => addCustomWallet() }, "Add");
  addActions.appendChild(addBtn);
  walletCard.appendChild(addActions);
  const customList = el("div", { class: "status-list" });
  walletCard.appendChild(customList);
  app.appendChild(walletCard);

  const requestCard = el("div", { class: "card" });
  requestCard.appendChild(el("h2", {}, "Build the request"));
  requestCard.appendChild(el("p", { class: "muted" }, "Everything selected by default -- uncheck anything you don't want to ask for."));
  const checkedIds = new Set(SAMPLE_REQUEST.items.map((i) => i.id));
  const checklist = el("div", { class: "status-list" });
  for (const item of SAMPLE_REQUEST.items) {
    const row = el("div", { class: "item-row" });
    const id = `vi-${item.id}`;
    row.appendChild(el("label", { for: id, class: "item-meta" }, [el("div", { class: "item-title" }, item.title ?? item.id)]));
    row.appendChild(
      el("input", {
        type: "checkbox",
        id,
        checked: "true",
        onchange: (e) => {
          if (e.target.checked) checkedIds.add(item.id);
          else checkedIds.delete(item.id);
        },
      }),
    );
    checklist.appendChild(row);
  }
  requestCard.appendChild(checklist);
  app.appendChild(requestCard);

  function buildRequest() {
    return {
      purpose: "M5 Health Verifier test -- pre-visit check-in",
      items: SAMPLE_REQUEST.items.filter((i) => checkedIds.has(i.id)),
    };
  }

  const pickerCard = el("div", { class: "card" });
  pickerCard.appendChild(el("h2", {}, "Send it"));
  pickerCard.appendChild(el("p", { class: "muted" }, "Choose a wallet below to run the check-in against it. The phone's own wallet is hidden here -- this tool is for testing web wallets specifically."));
  const picker = document.createElement("smart-checkin-picker");
  picker.setAttribute("mode", "pick");
  picker.setAttribute("platform", "off");
  pickerCard.appendChild(picker);
  app.appendChild(pickerCard);

  const resultCard = el("div", { class: "card", hidden: "true" });
  resultCard.id = "verifier-result";
  app.appendChild(resultCard);

  function renderCustomWalletList() {
    customList.innerHTML = "";
    const list = loadCustomWallets();
    if (!list.length) {
      customList.appendChild(el("p", { class: "muted" }, "No custom wallets added yet."));
      return;
    }
    for (const w of list) {
      const row = el("div", { class: "status-row" }, [
        el("span", {}, `${w.name} — ${w.walletUrl}`),
        el("button", {
          type: "button",
          class: "danger-text",
          onclick: () => {
            saveCustomWallets(loadCustomWallets().filter((x) => x.id !== w.id));
            renderCustomWalletList();
            refreshWallets();
          },
        }, "Remove"),
      ]);
      customList.appendChild(row);
    }
  }

  function addCustomWallet() {
    const name = nameInput.value.trim();
    const url = urlInput.value.trim();
    if (!name || !url) return;
    const list = loadCustomWallets();
    list.push({ id: `custom-${Date.now()}`, name, walletUrl: url, target: "tab" });
    saveCustomWallets(list);
    nameInput.value = "";
    urlInput.value = "";
    renderCustomWalletList();
    refreshWallets();
  }

  async function refreshWallets() {
    let registryWallets = [];
    try {
      registryWallets = await wallets({ registry: REGISTRY_URL });
    } catch {
      // Registry unreachable (offline, CORS, etc.) -- custom wallets still work.
    }
    picker.wallets = [...registryWallets, ...loadCustomWallets()];
  }

  renderCustomWalletList();
  picker.request = buildRequest();
  refreshWallets();

  // Re-build the request right before the patient actually picks a wallet,
  // so a checkbox ticked after the first render still takes effect.
  picker.addEventListener("smart-checkin-choose", () => {
    picker.request = buildRequest();
  });
  picker.addEventListener("smart-checkin-response", (e) => showVerifierResult({ outcome: "completed", detail: e.detail }));
  picker.addEventListener("smart-checkin-declined", () => showVerifierResult({ outcome: "declined" }));
  picker.addEventListener("smart-checkin-error", (e) => showVerifierResult({ outcome: "error", detail: e.detail }));
}

function showVerifierResult({ outcome, detail }) {
  const card = document.getElementById("verifier-result");
  if (!card) return;
  card.hidden = false;
  card.innerHTML = "";
  card.appendChild(el("h2", {}, "Result"));

  if (outcome === "declined") {
    card.appendChild(statusPill("declined", "off"));
    card.appendChild(el("p", { class: "muted" }, "The wallet declined the request."));
    return;
  }
  if (outcome === "error") {
    card.appendChild(statusPill(detail?.code ?? "error", "warn"));
    card.appendChild(el("p", { class: "muted" }, detail?.message ?? "The wallet reported an error."));
    return;
  }

  const response = detail?.response;
  if (!response) {
    card.appendChild(el("p", { class: "muted" }, "Completed, but no response object came back."));
    return;
  }

  let items = [];
  try {
    items = response.items?.() ?? [];
  } catch {
    items = [];
  }
  if (items.length) {
    const list = el("div", { class: "status-list" });
    for (const it of items) {
      list.appendChild(
        el("div", { class: "status-row" }, [
          el("span", {}, it.title ?? it.id ?? it.item ?? "(item)"),
          statusPill(it.status ?? "unknown", it.status === "fulfilled" ? "" : it.status === "declined" || it.status === "unsupported" ? "off" : "warn"),
        ]),
      );
    }
    card.appendChild(list);
  }

  const rawDetails = el("details", {});
  rawDetails.appendChild(el("summary", {}, "Raw response JSON"));
  let rawText = "(unavailable)";
  try {
    rawText = JSON.stringify(response.json ?? response, null, 2);
  } catch {
    // leave the placeholder text
  }
  rawDetails.appendChild(el("pre", { class: "log" }, rawText));
  card.appendChild(rawDetails);
}

// ---------------------------------------------------------------------------
// Wire up the real protocol
// ---------------------------------------------------------------------------

async function resolveFormState(request) {
  const formState = {};
  for (const item of request.items) {
    if (item.content?.kind !== "form.fhir") continue;
    if (item.content.questionnaire) {
      formState[item.id] = { questionnaire: item.content.questionnaire };
      continue;
    }
    if (item.content.questionnaireCanonical) {
      try {
        const base = item.content.questionnaireCanonical.split("|")[0];
        const res = await fetch(base);
        if (res.ok) formState[item.id] = { questionnaire: await res.json() };
      } catch {
        // left unresolved -> reported unsupported in buildResponse
      }
    }
  }
  return formState;
}

const served = serveWebWallet({
  onInvalidRequest(message, origin) {
    app.innerHTML = "";
    app.appendChild(el("h1", {}, "Could not read that request"));
    app.appendChild(el("p", { class: "muted" }, `From ${origin}: ${message}`));
  },
  async onRequest({ request, origin, unsupportedItems }) {
    const formState = await resolveFormState(request);
    return new Promise((resolve) => {
      renderConsentScreen({
        request,
        origin,
        unsupportedItems,
        formState,
        onSubmit: (decisions, combineShared) => {
          const response = buildResponse(request, unsupportedItems, decisions, formState, { combineShared });
          renderDone({ origin, response });
          resolve({ response });
        },
        onDeclineAll: () => {
          const response = declineAll(request);
          renderDone({ origin, response });
          resolve({ response });
        },
      });
    });
  },
});

renderHome({ opened: served.opened });
</script>
